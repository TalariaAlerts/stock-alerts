name: Daily Stock Alert

on:
  schedule:
    - cron: '0 22 * * 1-5'  # 8/9am Melbourne = 10pm UTC (adjust if needed)
  workflow_dispatch:  # allows manual run

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4 google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Debug location
        run: |
          pwd
          ls -la
          
      - name: Run script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python ./alert.py
